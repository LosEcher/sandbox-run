# miri-pure-core.conf — sandbox-run
#
# The pure core is the shape of what gets run and reported: result types and
# changeset defaults, overlay-scope computation, and the sandbox argv/environment
# builder. Getting the overlay set wrong is how a "sandboxed" run silently writes
# into the main tree, so it is worth proving.
#
# Excluded by measurement: `gates` / `report` / `sync` / `exec` / `docker` call
# `lstat` (or worse) inside their own tests — module-level names would have looked
# pure, the probe said otherwise.
MIRI_FILTERS=(types:: scope:: sandbox::)
MIRI_MIN_PASSED=9
MIRI_TARGET=bins
