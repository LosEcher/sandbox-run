name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            install-jj: 'true'
          - os: macos-latest
            install-jj: 'true'
          - os: windows-latest
            install-jj: 'false'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install jj (jj gates in gates.sh)
        if: matrix.install-jj == 'true' && runner.os == 'Linux'
        run: |
          curl -sL -o jj.tar.gz https://github.com/jj-vcs/jj/releases/download/v0.39.0/jj-v0.39.0-x86_64-unknown-linux-musl.tar.gz
          tar -xzf jj.tar.gz
          mv jj ~/.cargo/bin/jj
          jj --version
      - name: Install jj (macOS)
        if: matrix.install-jj == 'true' && runner.os == 'macOS'
        run: |
          curl -sL -o jj.tar.gz https://github.com/jj-vcs/jj/releases/download/v0.39.0/jj-v0.39.0-x86_64-apple-darwin.tar.gz
          tar -xzf jj.tar.gz
          mkdir -p "$HOME/.cargo/bin"
          mv jj "$HOME/.cargo/bin/jj"
          "$HOME/.cargo/bin/jj" --version
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Build
        run: cargo build
      - name: Unit tests
        run: cargo test
      - name: Acceptance gates (git + jj)
        shell: bash
        run: bash test/gates.sh

  # Release assets follow the fixed `sandbox-run-<os>-<arch>` naming contract
  # (consumers resolve the right file deterministically; each matrix row builds
  # for an explicit rustc target matching the runner's native arch).
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset: sandbox-run-linux-x86_64
            bin: sandbox-run
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            asset: sandbox-run-linux-x86_64-musl
            bin: sandbox-run
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            asset: sandbox-run-linux-aarch64-musl
            bin: sandbox-run
          - runner: macos-15
            target: aarch64-apple-darwin
            asset: sandbox-run-macos-aarch64
            bin: sandbox-run
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            asset: sandbox-run-windows-x86_64.exe
            bin: sandbox-run.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release binary (${{ matrix.target }})
        run: cargo build --release --target ${{ matrix.target }}
      - name: Stage asset as ${{ matrix.asset }}
        shell: bash
        run: |
          mkdir -p dist
          mv "target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Verify staged assets
        run: ls -la dist/
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
