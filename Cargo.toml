[package]
name = "sandbox-run"
version = "0.1.0"
edition = "2021"
description = "Isolated verification execution for AI agents: run build/test/lint commands inside a git worktree or jj workspace so the main working tree is never polluted."
license = "MIT"
repository = "https://github.com/LosEcher/sandbox-run"
keywords = ["sandbox", "verify", "agent", "worktree", "isolation"]
categories = ["development-tools", "command-line-utilities"]

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[[bin]]
name = "sandbox-run"
path = "src/main.rs"
